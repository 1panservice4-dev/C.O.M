```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DUEL LIFE</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090d;color:#fff;font-family:Arial,sans-serif}
button{border:0;color:#fff;font-weight:bold;touch-action:manipulation;cursor:pointer}
button:active{transform:scale(.95)}

.app{width:100%;height:100dvh;overflow:hidden;background:radial-gradient(circle,#1b2433 0,#090c12 55%,#050609 100%)}

#mainScreen{height:100%;display:flex;flex-direction:column}

.topbar{
 height:12%;min-height:58px;display:flex;align-items:center;justify-content:space-between;
 padding:0 14px;background:linear-gradient(#202733,#10141b);
 border-bottom:1px solid #394454
}
.logo{font-size:20px;font-weight:900;letter-spacing:2px}
.logo small{display:block;font-size:9px;color:#728096;letter-spacing:3px}
.turnStatus{text-align:right}
.turnText{font-size:9px;color:#778397;letter-spacing:1px}
.turnPlayer{font-size:18px;font-weight:900}

.duelArea{flex:1;min-height:0;display:flex;position:relative}

.player{
 flex:1;min-width:0;display:flex;align-items:center;justify-content:center;
 padding:10px;position:relative;transition:.25s;overflow:hidden
}
.player1{border-right:1px solid #303744}
.player.active{background:radial-gradient(circle,rgba(45,115,255,.15),transparent 70%)}
.player2.active{background:radial-gradient(circle,rgba(255,65,65,.15),transparent 70%)}

.panel{
 width:94%;height:92%;max-width:430px;border:1px solid #303947;
 border-radius:18px;background:linear-gradient(145deg,#202733,#11151c);
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 padding:12px;transition:.25s;box-shadow:0 8px 25px #0008
}
.player.active .panel{border-color:#3c82ff;box-shadow:0 0 12px #3c82ff55}
.player2.active .panel{border-color:#ff4646;box-shadow:0 0 12px #ff464655}

.playerName{font-size:clamp(13px,2.5vw,22px);font-weight:900;margin-bottom:8px}
.player1 .playerName{color:#6da0ff}
.player2 .playerName{color:#ff7777}

.lifeBox{
 width:100%;height:58%;display:flex;flex-direction:column;align-items:center;justify-content:center;
 border:1px solid #303947;border-radius:14px;background:#0c1017;cursor:pointer
}
.lifeIcon{font-size:clamp(30px,7vw,55px)}
.lifeNumber{font-size:clamp(38px,8vw,72px);font-weight:900;line-height:1}
.lifeLabel{font-size:10px;color:#718096;margin-top:8px;letter-spacing:1px}

.costBox{
 width:100%;margin-top:8px;padding:9px;border-radius:12px;
 background:#0c1017;border:1px solid #303947;cursor:pointer;text-align:center
}
.costTitle{font-size:10px;color:#718096;letter-spacing:1px}
.costNumber{font-size:clamp(20px,4vw,32px);color:#ffd54a;font-weight:900;margin-top:3px}

.center{
 position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 width:clamp(85px,14vw,130px);z-index:5;display:flex;flex-direction:column;align-items:center
}
.turnButton{
 width:100%;aspect-ratio:1;border-radius:50%;background:linear-gradient(145deg,#38475e,#151b25);
 border:3px solid #53657d;box-shadow:0 0 0 5px #080b10,0 0 20px #000;
 font-size:clamp(11px,2vw,17px);font-weight:900
}
.turnButton.end{background:linear-gradient(145deg,#a43d3d,#35171a);border-color:#ff6262}
.turnNo{font-size:10px;color:#718096;margin-top:8px;white-space:nowrap}

.bottom{
 height:13%;min-height:65px;display:flex;align-items:center;justify-content:center;gap:8px;
 background:#10141b;border-top:1px solid #303947
}
.toolButton{padding:10px 14px;border-radius:10px;background:#252e3c;font-size:clamp(11px,2.5vw,15px)}
.reset{background:#343b48}

.randomResult{
 position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
 padding:20px 35px;background:#080a0eee;border:1px solid #53657d;border-radius:16px;
 font-size:clamp(28px,7vw,55px);font-weight:900;display:none;z-index:100;text-align:center
}

/* 계산기 */
#calculatorScreen{display:none;width:100%;height:100%;flex-direction:column;background:#090c12}
.calcHeader{
 height:14%;min-height:60px;display:flex;align-items:center;justify-content:space-between;
 padding:0 12px;background:linear-gradient(#202733,#10141b);border-bottom:1px solid #394454
}
.backButton{background:#343e4d;padding:11px 15px;border-radius:10px}
.calcTitle{font-size:clamp(16px,4vw,25px);font-weight:900}
.calcTarget{font-size:12px;color:#8b98aa}

.calcContent{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px}
.calcDisplay{
 width:100%;height:20%;min-height:65px;background:#05070b;color:#fff;border:1px solid #394454;
 border-radius:14px;text-align:center;font-size:clamp(30px,8vw,55px);font-weight:900;margin-bottom:10px
}
.calcButtons{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.calcButtons button{border-radius:12px;background:#252e3c;font-size:clamp(18px,5vw,28px)}
.calcButtons .clear{background:#a93232}
.calcButtons .minus{background:#8f3030}
.calcButtons .plus{background:#176d46}
.calcButtons .zero{grid-column:span 2}
</style>
</head>

<body>
<div class="app">

<div id="mainScreen">

  <div class="topbar">
    <div class="logo">DUEL LIFE<small>DUEL ASSIST SYSTEM</small></div>
    <div class="turnStatus">
      <div class="turnText">CURRENT TURN</div>
      <div id="turnPlayerText" class="turnPlayer">🔵 P1</div>
    </div>
  </div>

  <div class="duelArea">

    <div id="player1" class="player player1 active">
      <div class="panel">
        <div class="playerName">🔵 PLAYER 1</div>
        <div class="lifeBox" onclick="openLifeCalculator(1)">
          <div class="lifeIcon">❤️</div>
          <div id="life1" class="lifeNumber">15</div>
          <div class="lifeLabel">LIFE POINTS · TOUCH</div>
        </div>
        <div class="costBox" onclick="openCostCalculator(1)">
          <div class="costTitle">🔵 COST</div>
          <div id="cost1" class="costNumber">0</div>
        </div>
      </div>
    </div>

    <div id="player2" class="player player2">
      <div class="panel">
        <div class="playerName">🔴 PLAYER 2</div>
        <div class="lifeBox" onclick="openLifeCalculator(2)">
          <div class="lifeIcon">❤️</div>
          <div id="life2" class="lifeNumber">15</div>
          <div class="lifeLabel">LIFE POINTS · TOUCH</div>
        </div>
        <div class="costBox" onclick="openCostCalculator(2)">
          <div class="costTitle">🔵 COST</div>
          <div id="cost2" class="costNumber">0</div>
        </div>
      </div>
    </div>

    <div class="center">
      <button id="turnButton" class="turnButton" onclick="turnButtonClick()">▶<br>턴 시작</button>
      <div id="turnNo" class="turnNo">TURN 1</div>
    </div>

  </div>

  <div class="bottom">
    <button class="toolButton" onclick="rollDice()">🎲 주사위</button>
    <button class="toolButton" onclick="flipCoin()">🪙 동전</button>
    <button class="toolButton reset" onclick="resetGame()">↻ 초기화</button>
  </div>

</div>


<div id="calculatorScreen">

  <div class="calcHeader">
    <button class="backButton" onclick="closeCalculator()">← 돌아가기</button>
    <div id="calcTitle" class="calcTitle">❤️ 목숨 계산</div>
    <div id="calcTarget" class="calcTarget">P1</div>
  </div>

  <div class="calcContent">
    <input id="calcDisplay" class="calcDisplay" value="0" readonly>

    <div class="calcButtons">
      <button onclick="inputNumber('1')">1</button>
      <button onclick="inputNumber('2')">2</button>
      <button onclick="inputNumber('3')">3</button>
      <button onclick="inputNumber('4')">4</button>
      <button onclick="inputNumber('5')">5</button>
      <button onclick="inputNumber('6')">6</button>
      <button onclick="inputNumber('7')">7</button>
      <button onclick="inputNumber('8')">8</button>
      <button onclick="inputNumber('9')">9</button>
      <button class="clear" onclick="clearCalculator()">C</button>
      <button class="zero" onclick="inputNumber('0')">0</button>
      <button onclick="backspace()">←</button>
      <button class="minus" onclick="calculate(-1)">➖ 빼기</button>
      <button class="plus" onclick="calculate(1)">➕ 더하기</button>
    </div>
  </div>

</div>

<div id="randomResult" class="randomResult">🎲 1</div>

</div>

<script>
let life={1:15,2:15};
let cost={1:0,2:0};
let currentPlayer=1;
let turnStarted=false;
let turnNumber=1;

let calculatorType="life";
let calculatorPlayer=1;
let calcValue="";

function updateScreen(){
  document.getElementById("life1").textContent=life[1];
  document.getElementById("life2").textContent=life[2];
  document.getElementById("cost1").textContent=cost[1];
  document.getElementById("cost2").textContent=cost[2];

  document.getElementById("player1").classList.toggle("active",currentPlayer===1);
  document.getElementById("player2").classList.toggle("active",currentPlayer===2);

  document.getElementById("turnPlayerText").textContent=
    currentPlayer===1?"🔵 P1":"🔴 P2";

  document.getElementById("turnNo").textContent="TURN "+turnNumber;

  const b=document.getElementById("turnButton");

  if(turnStarted){
    b.innerHTML="⏹<br>턴 종료";
    b.classList.add("end");
  }else{
    b.innerHTML="▶<br>턴 시작";
    b.classList.remove("end");
  }
}

function turnButtonClick(){
  if(!turnStarted){
    turnStarted=true;
    cost[currentPlayer]+=3;
    updateScreen();
    showRandomResult("▶️ P"+currentPlayer+" 턴 시작");
  }else{
    turnStarted=false;
    currentPlayer=currentPlayer===1?2:1;
    turnNumber++;
    updateScreen();

    setTimeout(()=>{
      turnStarted=true;
      cost[currentPlayer]+=3;
      updateScreen();
      showRandomResult("▶️ P"+currentPlayer+" 턴 시작");
    },250);
  }
}

function openLifeCalculator(p){
  calculatorType="life";
  calculatorPlayer=p;
  calcValue="";
  document.getElementById("calcTitle").textContent="❤️ 목숨 계산";
  document.getElementById("calcTarget").textContent="P"+p;
  document.getElementById("mainScreen").style.display="none";
  document.getElementById("calculatorScreen").style.display="flex";
  updateCalcDisplay();
}

function openCostCalculator(p){
  calculatorType="cost";
  calculatorPlayer=p;
  calcValue="";
  document.getElementById("calcTitle").textContent="🔵 코스트 계산";
  document.getElementById("calcTarget").textContent="P"+p;
  document.getElementById("mainScreen").style.display="none";
  document.getElementById("calculatorScreen").style.display="flex";
  updateCalcDisplay();
}

function inputNumber(n){
  if(calcValue==="0")calcValue="";
  calcValue+=n;
  updateCalcDisplay();
}

function updateCalcDisplay(){
  document.getElementById("calcDisplay").value=calcValue||"0";
}

function clearCalculator(){
  calcValue="";
  updateCalcDisplay();
}

function backspace(){
  calcValue=calcValue.slice(0,-1);
  updateCalcDisplay();
}

function calculate(sign){
  const value=parseInt(calcValue);
  if(isNaN(value)||value===0)return;

  if(calculatorType==="life"){
    life[calculatorPlayer]+=value*sign;
    if(life[calculatorPlayer]<0)life[calculatorPlayer]=0;
  }else{
    cost[calculatorPlayer]+=value*sign;
    if(cost[calculatorPlayer]<0)cost[calculatorPlayer]=0;
  }

  updateScreen();
  closeCalculator();
}

function closeCalculator(){
  document.getElementById("calculatorScreen").style.display="none";
  document.getElementById("mainScreen").style.display="flex";
}

function rollDice(){
  showRandomResult("🎲 "+(Math.floor(Math.random()*6)+1));
}

function flipCoin(){
  showRandomResult("🪙 "+(Math.random()<.5?"앞면":"뒷면"));
}

function showRandomResult(text){
  const r=document.getElementById("randomResult");
  r.textContent=text;
  r.style.display="block";
  setTimeout(()=>r.style.display="none",1000);
}

function resetGame(){
  if(!confirm("게임을 처음 상태로 초기화할까요?"))return;
  life={1:15,2:15};
  cost={1:0,2:0};
  currentPlayer=1;
  turnStarted=false;
  turnNumber=1;
  closeCalculator();
  updateScreen();
}

updateScreen();
</script>
</body>
</html>
```
