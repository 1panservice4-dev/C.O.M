```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>1대1 목숨 & 코스트</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #10131a;
    color: white;
}

button {
    border: none;
    color: white;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
}

button:active {
    transform: scale(0.95);
}


/* =========================
   전체 앱
========================= */

.app {
    width: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
}


/* =========================
   메인 화면
========================= */

#mainScreen {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}


/* 상단 */

.header {
    height: 14%;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px;
    background: #181d27;
}

.title {
    font-size: clamp(18px, 4vw, 28px);
    font-weight: bold;
}

.turnInfo {
    text-align: center;
}

.turnLabel {
    font-size: 13px;
    color: #aaa;
}

.turnPlayer {
    font-size: clamp(20px, 5vw, 32px);
    font-weight: bold;
}


/* =========================
   플레이어 영역
========================= */

.players {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 0;
}

.player {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 10px;

    border-right: 1px solid #303642;

    transition: background .2s;
}

.player:last-child {
    border-right: none;
}

.player.active {
    background: #20283a;
}

.playerName {
    font-size: clamp(18px, 4vw, 26px);
    font-weight: bold;
    margin-bottom: 8px;
}


/* =========================
   목숨
========================= */

.lifeBox {
    width: 90%;
    height: 42%;
    max-height: 220px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    border-radius: 20px;
    background: #181d27;

    border: 2px solid transparent;

    cursor: pointer;
}

.player.active .lifeBox {
    border-color: #6c45d9;
}

.lifeIcon {
    font-size: clamp(35px, 9vw, 65px);
}

.lifeNumber {
    font-size: clamp(40px, 11vw, 75px);
    font-weight: bold;
}

.touchText {
    font-size: 12px;
    color: #888;
    margin-top: 5px;
}


/* =========================
   코스트
========================= */

.costBox {
    width: 90%;
    margin-top: 10px;
    padding: 10px;

    background: #181d27;
    border-radius: 14px;

    cursor: pointer;
}

.costTitle {
    font-size: 13px;
    color: #aaa;
}

.costNumber {
    font-size: clamp(24px, 6vw, 38px);
    color: #ffd54a;
    font-weight: bold;
}


/* =========================
   하단 버튼
========================= */

.bottom {
    height: 22%;
    min-height: 125px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background: #181d27;
}

.turnButton {
    width: 90%;
    max-width: 600px;

    padding: 16px;
    border-radius: 14px;

    background: #6c45d9;

    font-size: clamp(18px, 4vw, 24px);
}

.turnButton.end {
    background: #c0392b;
}

.tools {
    display: flex;
    justify-content: center;
    gap: 8px;

    margin-top: 8px;
}

.toolButton {
    padding: 9px 14px;
    border-radius: 10px;
    background: #303746;
}


/* =========================
   계산기 화면
========================= */

#calculatorScreen {
    display: none;

    width: 100%;
    height: 100%;

    flex-direction: column;
}

.calcHeader {
    height: 15%;
    min-height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 10px 15px;

    background: #181d27;
}

.backButton {
    background: #444b5a;
    padding: 12px 18px;
    border-radius: 10px;
}

.calcTitle {
    font-size: clamp(18px, 5vw, 28px);
    font-weight: bold;
}

.calcTarget {
    font-size: 14px;
    color: #aaa;
}


/* 계산기 내용 */

.calcContent {
    flex: 1;

    display: flex;
    flex-direction: column;

    padding: 10px;
    min-height: 0;
}

.calcDisplay {
    width: 100%;

    height: 18%;
    min-height: 60px;

    border: none;
    border-radius: 14px;

    background: #080a0e;
    color: white;

    text-align: center;

    font-size: clamp(30px, 8vw, 50px);
    font-weight: bold;

    margin-bottom: 10px;
}


/* 계산 버튼 */

.calcButtons {
    flex: 1;

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 7px;

    min-height: 0;
}

.calcButtons button {
    border-radius: 12px;

    background: #303746;

    font-size: clamp(18px, 5vw, 27px);
}

.calcButtons .clear {
    background: #c0392b;
}

.calcButtons .plus {
    background: #168a4a;
}

.calcButtons .minus {
    background: #a93226;
}

.calcButtons .zero {
    grid-column: span 2;
}


/* =========================
   랜덤 화면
========================= */

.randomResult {
    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    padding: 25px 40px;

    background: rgba(0,0,0,.92);

    border-radius: 20px;

    font-size: 45px;
    font-weight: bold;

    display: none;

    z-index: 100;
}

</style>
</head>


<body>

<div class="app">


<!-- =================================
     메인 화면
================================= -->

<div id="mainScreen">

    <div class="header">

        <div class="title">
            ❤️ 1대1 게임
        </div>

        <div class="turnInfo">

            <div class="turnLabel">
                현재 턴
            </div>

            <div
                id="turnPlayerText"
                class="turnPlayer">
                🔵 플레이어 1
            </div>

        </div>

    </div>


    <!-- 플레이어 -->

    <div class="players">


        <!-- 플레이어 1 -->

        <div
            id="player1"
            class="player active">

            <div class="playerName">
                🔵 플레이어 1
            </div>


            <!-- 목숨 터치 -->

            <div
                class="lifeBox"
                onclick="openLifeCalculator(1)">

                <div class="lifeIcon">
                    ❤️
                </div>

                <div
                    id="life1"
                    class="lifeNumber">
                    15
                </div>

                <div class="touchText">
                    터치하여 목숨 계산
                </div>

            </div>


            <!-- 코스트 터치 -->

            <div
                class="costBox"
                onclick="openCostCalculator(1)">

                <div class="costTitle">
                    🔵 코스트
                </div>

                <div
                    id="cost1"
                    class="costNumber">
                    0
                </div>

            </div>

        </div>



        <!-- 플레이어 2 -->

        <div
            id="player2"
            class="player">

            <div class="playerName">
                🔴 플레이어 2
            </div>


            <!-- 목숨 -->

            <div
                class="lifeBox"
                onclick="openLifeCalculator(2)">

                <div class="lifeIcon">
                    ❤️
                </div>

                <div
                    id="life2"
                    class="lifeNumber">
                    15
                </div>

                <div class="touchText">
                    터치하여 목숨 계산
                </div>

            </div>


            <!-- 코스트 -->

            <div
                class="costBox"
                onclick="openCostCalculator(2)">

                <div class="costTitle">
                    🔵 코스트
                </div>

                <div
                    id="cost2"
                    class="costNumber">
                    0
                </div>

            </div>

        </div>

    </div>


    <!-- 하단 -->

    <div class="bottom">

        <button
            id="turnButton"
            class="turnButton"
            onclick="turnButtonClick()">

            ⏱️ 턴 시작

        </button>


        <div class="tools">

            <button
                class="toolButton"
                onclick="rollDice()">
                🎲 주사위
            </button>

            <button
                class="toolButton"
                onclick="flipCoin()">
                🪙 동전
            </button>

            <button
                class="toolButton"
                onclick="resetGame()">
                🔄 초기화
            </button>

        </div>

    </div>

</div>



<!-- =================================
     계산기 화면
================================= -->

<div id="calculatorScreen">

    <div class="calcHeader">

        <button
            class="backButton"
            onclick="closeCalculator()">
            ← 돌아가기
        </button>

        <div
            id="calcTitle"
            class="calcTitle">
            ❤️ 목숨 계산
        </div>

        <div
            id="calcTarget"
            class="calcTarget">
            P1
        </div>

    </div>


    <div class="calcContent">

        <input
            id="calcDisplay"
            class="calcDisplay"
            value="0"
            readonly>


        <div class="calcButtons">

            <button onclick="inputNumber('1')">1</button>
            <button onclick="inputNumber('2')">2</button>
            <button onclick="inputNumber('3')">3</button>

            <button onclick="inputNumber('4')">4</button>
            <button onclick="inputNumber('5')">5</button>
            <button onclick="inputNumber('6')">6</button>

            <button onclick="inputNumber('7')">7</button>
            <button onclick="inputNumber('8')">8</button>
            <button onclick="inputNumber('9')">9</button>

            <button
                class="clear"
                onclick="clearCalculator()">
                C
            </button>

            <button
                class="zero"
                onclick="inputNumber('0')">
                0
            </button>

            <button
                onclick="backspace()">
                ←
            </button>

            <button
                class="minus"
                onclick="calculate(-1)">
                ➖ 빼기
            </button>

            <button
                class="plus"
                onclick="calculate(1)">
                ➕ 더하기
            </button>

        </div>

    </div>

</div>


<!-- 랜덤 결과 -->

<div
    id="randomResult"
    class="randomResult">
    🎲 1
</div>


</div>



<script>


/* =================================
   게임 데이터
================================= */

let life = {
    1: 15,
    2: 15
};

let cost = {
    1: 0,
    2: 0
};


/*
   현재 플레이어
   1 = P1
   2 = P2
*/

let currentPlayer = 1;


/*
   턴 상태

   false = 턴 시작 전
   true  = 턴 진행 중
*/

let turnStarted = false;


/*
   계산기 상태
*/

let calculatorType = "life";
let calculatorPlayer = 1;
let calcValue = "";


/* =================================
   화면 갱신
================================= */

function updateScreen() {

    document.getElementById("life1").textContent =
        life[1];

    document.getElementById("life2").textContent =
        life[2];


    document.getElementById("cost1").textContent =
        cost[1];

    document.getElementById("cost2").textContent =
        cost[2];


    /*
       현재 플레이어 강조
    */

    document.getElementById("player1")
        .classList.toggle(
            "active",
            currentPlayer === 1
        );

    document.getElementById("player2")
        .classList.toggle(
            "active",
            currentPlayer === 2
        );


    document.getElementById("turnPlayerText")
        .textContent =
        currentPlayer === 1
        ? "🔵 플레이어 1"
        : "🔴 플레이어 2";


    /*
       턴 버튼
    */

    const button =
        document.getElementById("turnButton");


    if (!turnStarted) {

        button.textContent =
            "⏱️ 턴 시작";

        button.classList.remove("end");

    } else {

        button.textContent =
            "⏹️ 턴 종료";

        button.classList.add("end");
    }

}


/* =================================
   턴 버튼
================================= */

function turnButtonClick() {

    /*
       턴 시작
    */

    if (!turnStarted) {

        turnStarted = true;


        /*
           현재 턴 플레이어에게만
           코스트 +3
        */

        cost[currentPlayer] += 3;


        updateScreen();

        showRandomResult(
            "▶️ P" + currentPlayer + " 턴 시작"
        );

        return;
    }


    /*
       턴 종료
    */

    turnStarted = false;


    /*
       자동으로 상대방에게 턴 전달
    */

    currentPlayer =
        currentPlayer === 1
        ? 2
        : 1;


    updateScreen();


    /*
       상대 턴 자동 시작
       → 여기서 +3
    */

    setTimeout(function() {

        turnStarted = true;

        cost[currentPlayer] += 3;

        updateScreen();

        showRandomResult(
            "▶️ P" + currentPlayer + " 턴 시작\n+3 코스트"
        );

    }, 250);

}


/* =================================
   목숨 계산기 열기
================================= */

function openLifeCalculator(player) {

    calculatorType = "life";
    calculatorPlayer = player;

    calcValue = "";

    document.getElementById("calcTitle")
        .textContent =
        "❤️ 목숨 계산";

    document.getElementById("calcTarget")
        .textContent =
        "P" + player;

    document.getElementById("mainScreen")
        .style.display = "none";

    document.getElementById("calculatorScreen")
        .style.display = "flex";

    updateCalcDisplay();

}


/* =================================
   코스트 계산기 열기
================================= */

function openCostCalculator(player) {

    calculatorType = "cost";
    calculatorPlayer = player;

    calcValue = "";

    document.getElementById("calcTitle")
        .textContent =
        "🔵 코스트 계산";

    document.getElementById("calcTarget")
        .textContent =
        "P" + player;

    document.getElementById("mainScreen")
        .style.display = "none";

    document.getElementById("calculatorScreen")
        .style.display = "flex";

    updateCalcDisplay();

}


/* =================================
   계산기 숫자
================================= */

function inputNumber(number) {

    if (calcValue === "0") {
        calcValue = "";
    }

    calcValue += number;

    updateCalcDisplay();

}


/* =================================
   계산기 표시
================================= */

function updateCalcDisplay() {

    document.getElementById("calcDisplay")
        .value =
        calcValue === ""
        ? "0"
        : calcValue;

}


/* =================================
   계산기 초기화
================================= */

function clearCalculator() {

    calcValue = "";

    updateCalcDisplay();

}


/* =================================
   뒤로가기
================================= */

function backspace() {

    calcValue =
        calcValue.slice(0, -1);

    updateCalcDisplay();

}


/* =================================
   계산 실행
================================= */

function calculate(sign) {

    let value =
        parseInt(calcValue);


    if (
        isNaN(value) ||
        value === 0
    ) {
        return;
    }


    if (calculatorType === "life") {

        life[calculatorPlayer] +=
            value * sign;


        /*
           목숨은 음수가 되지 않음
        */

        if (
            life[calculatorPlayer] < 0
        ) {
            life[calculatorPlayer] = 0;
        }

    } else {

        cost[calculatorPlayer] +=
            value * sign;


        /*
           코스트도 음수가 되지 않음
        */

        if (
            cost[calculatorPlayer] < 0
        ) {
            cost[calculatorPlayer] = 0;
        }

    }


    updateScreen();

    closeCalculator();

}


/* =================================
   계산기 닫기
================================= */

function closeCalculator() {

    document.getElementById("calculatorScreen")
        .style.display = "none";

    document.getElementById("mainScreen")
        .style.display = "flex";

}


/* =================================
   주사위
================================= */

function rollDice() {

    let result =
        Math.floor(Math.random() * 6) + 1;

    showRandomResult(
        "🎲 " + result
    );

}


/* =================================
   동전
================================= */

function flipCoin() {

    let result =
        Math.random() < 0.5
        ? "앞면"
        : "뒷면";

    showRandomResult(
        "🪙 " + result
    );

}


/* =================================
   랜덤 결과 표시
================================= */

function showRandomResult(text) {

    const result =
        document.getElementById("randomResult");

    result.textContent = text;

    result.style.display = "block";


    setTimeout(function() {

        result.style.display = "none";

    }, 1000);

}


/* =================================
   게임 초기화
================================= */

function resetGame() {

    if (
        !confirm(
            "게임을 처음 상태로 초기화할까요?"
        )
    ) {
        return;
    }


    life[1] = 15;
    life[2] = 15;

    cost[1] = 0;
    cost[2] = 0;

    currentPlayer = 1;

    turnStarted = false;

    closeCalculator();

    updateScreen();

}


/* =================================
   시작
================================= */

updateScreen();

</script>

</body>
</html>
```
